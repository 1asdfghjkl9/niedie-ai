<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>逆蝶AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0a0a12;
      --bg-secondary: #15151f;
      --bg-tertiary: #1e1e2e;
      --bg-hover: #252535;
      --accent: #7c5ce7;
      --accent-light: #a29bfe;
      --accent-glow: rgba(124, 92, 231, 0.15);
      --text-primary: #e8e8f0;
      --text-secondary: #9999aa;
      --text-muted: #5a5a6a;
      --border-color: #2a2a3a;
      --red: #ef4444;
      --blue: #3b82f6;
      --green: #22c55e;
      --gold: #fbbf24;
      --orange: #f97316;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a5a; }
    ::selection { background: rgba(124, 92, 231, 0.3); }

    .app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 250px; height: 100%; background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: transform 0.3s ease; z-index: 40;
    }
    .sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border-color); }
    .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .logo-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: bold; font-size: 16px;
      box-shadow: 0 2px 12px var(--accent-glow);
    }
    .logo-text { font-size: 15px; font-weight: 600; }
    .credits-bar {
      background: var(--bg-tertiary); border-radius: var(--radius-md);
      padding: 10px 12px; margin-bottom: 12px;
    }
    .credits-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .credits-label { font-size: 11px; color: var(--text-muted); }
    .credits-value { font-size: 14px; font-weight: 600; color: var(--gold); }
    .credits-progress { height: 4px; background: var(--bg-primary); border-radius: 2px; overflow: hidden; }
    .credits-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--gold), var(--orange));
      transition: width 0.5s ease;
    }
    .credits-actions { display: flex; gap: 6px; margin-top: 8px; }
    .credits-btn {
      flex: 1; padding: 6px 8px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-color); background: var(--bg-primary);
      color: var(--text-secondary); font-size: 11px; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .credits-btn:hover { border-color: var(--accent); color: var(--accent-light); }
    .credits-btn.checkin-done { opacity: 0.5; cursor: default; }
    .btn-new {
      width: 100%; padding: 10px 16px; border-radius: var(--radius-md); border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white; font-size: 14px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-new:hover { opacity: 0.9; }
    .btn-new:active { transform: scale(0.98); }
    .btn-new svg { width: 16px; height: 16px; }
    .conv-list { flex: 1; overflow-y: auto; padding: 6px; }
    .conv-empty { text-align: center; color: var(--text-muted); font-size: 12px; padding: 32px 0; }
    .conv-item {
      display: flex; align-items: center; gap: 8px; padding: 9px 10px;
      border-radius: var(--radius-sm); cursor: pointer; transition: background 0.2s;
      margin-bottom: 2px; position: relative;
    }
    .conv-item:hover { background: var(--bg-hover); }
    .conv-item.active { background: var(--bg-tertiary); }
    .conv-item svg { width: 14px; height: 14px; opacity: 0.5; flex-shrink: 0; }
    .conv-item span { flex: 1; font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv-item.active span { color: var(--text-primary); }
    .conv-delete {
      opacity: 0; width: 22px; height: 22px; border: none; background: transparent;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      border-radius: 4px; flex-shrink: 0; color: var(--text-muted);
    }
    .conv-item:hover .conv-delete { opacity: 1; }
    .conv-delete:hover { color: var(--red); }
    .conv-delete svg { width: 13px; height: 13px; opacity: 1; }
    .sidebar-footer { padding: 10px 12px; border-top: 1px solid var(--border-color); text-align: center; font-size: 10px; color: var(--text-muted); }

    /* ===== Main ===== */
    .main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
    .header {
      flex-shrink: 0; display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--border-color);
      background: var(--bg-secondary);
    }
    .menu-btn { display: none; padding: 6px; border: none; background: transparent; cursor: pointer; border-radius: 6px; color: var(--text-secondary); }
    .menu-btn:hover { background: var(--bg-tertiary); }
    .menu-btn svg { width: 20px; height: 20px; }
    .header-title { flex: 1; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-credits {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.2);
      font-size: 13px; font-weight: 600; color: var(--gold);
    }
    .header-credits svg { width: 14px; height: 14px; }
    .status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent-light); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-light); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .error-bar {
      flex-shrink: 0; padding: 8px 16px; background: rgba(239, 68, 68, 0.1);
      border-bottom: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5;
      font-size: 12px; display: flex; align-items: center; justify-content: space-between;
    }
    .error-bar button { background: transparent; border: none; color: #fca5a5; cursor: pointer; font-size: 14px; }

    /* ===== Messages ===== */
    .messages { flex: 1; overflow-y: auto; padding: 20px 16px; }
    .messages-inner { max-width: 760px; margin: 0 auto; }
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; text-align: center; max-width: 480px; margin: 0 auto;
      animation: fadeIn 0.4s ease;
    }
    .empty-icon {
      width: 72px; height: 72px; margin-bottom: 20px; border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 30px; font-weight: bold;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .empty-title {
      font-size: 22px; font-weight: bold; margin-bottom: 10px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .empty-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 28px; }
    .empty-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
    .empty-card {
      padding: 14px; border-radius: var(--radius-md); background: var(--bg-secondary);
      border: 1px solid var(--border-color); transition: all 0.2s; cursor: pointer;
    }
    .empty-card:hover { border-color: rgba(124, 92, 231, 0.5); background: var(--bg-tertiary); }
    .empty-card-icon { font-size: 22px; margin-bottom: 6px; }
    .empty-card-title { font-size: 13px; font-weight: 500; }
    .empty-card-desc { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

    .msg-row { display: flex; gap: 10px; margin-bottom: 20px; animation: slideUp 0.3s ease; }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      flex-shrink: 0; width: 30px; height: 30px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 11px; font-weight: bold;
    }
    .msg-avatar.user { background: var(--blue); }
    .msg-avatar.ai { background: linear-gradient(135deg, var(--accent), var(--accent-light)); }
    .msg-content-wrapper { display: flex; flex-direction: column; gap: 3px; max-width: 75%; }
    .msg-row.user .msg-content-wrapper { align-items: flex-end; }
    .msg-bubble {
      padding: 11px 15px; border-radius: var(--radius-lg); font-size: 14px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg-row.user .msg-bubble { background: var(--blue); color: white; border-top-right-radius: 4px; }
    .msg-row.ai .msg-bubble { background: var(--bg-secondary); color: var(--text-primary); border-top-left-radius: 4px; }
    .msg-bubble.error { background: rgba(239, 68, 68, 0.1) !important; color: #fca5a5 !important; border: 1px solid rgba(239, 68, 68, 0.3); }
    .msg-bubble code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: 'Fira Code', monospace; }
    .msg-bubble strong { font-weight: 600; color: var(--accent-light); }
    .msg-time { font-size: 10px; color: var(--text-muted); padding: 0 6px; }
    .msg-cost { font-size: 10px; color: var(--gold); padding: 0 6px; opacity: 0.7; }
    .msg-image { max-width: 200px; max-height: 200px; border-radius: var(--radius-md); margin-top: 4px; }
    .typing-indicator { display: flex; gap: 10px; margin-bottom: 20px; animation: fadeIn 0.3s ease; }
    .typing-dots {
      display: flex; align-items: center; gap: 5px; padding: 14px;
      border-radius: var(--radius-lg); border-top-left-radius: 4px; background: var(--bg-secondary);
    }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-light); animation: bounce 1.4s infinite ease-in-out; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== Input ===== */
    .input-area { flex-shrink: 0; padding: 12px 16px; border-top: 1px solid var(--border-color); background: var(--bg-primary); }
    .input-wrapper {
      max-width: 760px; margin: 0 auto;
      display: flex; align-items: flex-end; gap: 6px;
      background: var(--bg-secondary); border-radius: var(--radius-lg);
      border: 1px solid var(--border-color); padding: 6px 10px;
      transition: border-color 0.2s;
    }
    .input-wrapper:focus-within { border-color: rgba(124, 92, 231, 0.5); box-shadow: 0 0 0 2px var(--accent-glow); }
    .tool-btn {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: var(--radius-sm); border: none;
      background: transparent; color: var(--text-secondary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: var(--bg-tertiary); color: var(--accent-light); }
    .tool-btn svg { width: 19px; height: 19px; }
    .input textarea {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text-primary); font-size: 14px; font-family: inherit;
      resize: none; max-height: 150px; min-height: 22px; line-height: 1.5;
    }
    .input textarea::placeholder { color: var(--text-muted); }
    .input textarea:disabled { opacity: 0.5; }
    .send-btn {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: var(--radius-sm); border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s, transform 0.1s;
    }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; background: var(--bg-tertiary); }
    .send-btn:not(:disabled):hover { opacity: 0.9; }
    .send-btn:not(:disabled):active { transform: scale(0.95); }
    .send-btn svg { width: 17px; height: 17px; }
    .input-hint { text-align: center; font-size: 10px; color: var(--text-muted); margin-top: 6px; }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
      z-index: 100; align-items: center; justify-content: center;
      animation: fadeIn 0.2s ease; backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 22px;
      max-width: 90vw; width: 400px; border: 1px solid var(--border-color);
      animation: slideUp 0.3s ease;
    }
    .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
    .modal-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }
    .modal-input {
      width: 100%; padding: 11px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-color);
      background: var(--bg-primary); color: var(--text-primary); font-size: 14px; outline: none;
      transition: border-color 0.2s;
    }
    .modal-input:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
    .modal-btn {
      padding: 9px 18px; border-radius: var(--radius-md); border: none; font-size: 14px; cursor: pointer;
      font-weight: 500; transition: opacity 0.2s;
    }
    .modal-btn.cancel { background: var(--bg-tertiary); color: var(--text-secondary); }
    .modal-btn.cancel:hover { opacity: 0.8; }
    .modal-btn.confirm {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white;
    }
    .modal-btn.confirm:hover { opacity: 0.9; }
    .modal-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== Camera ===== */
    .camera-container { position: relative; margin-bottom: 14px; border-radius: var(--radius-md); overflow: hidden; background: #000; }
    .camera-video { width: 100%; display: block; max-height: 280px; object-fit: cover; }
    .camera-canvas { display: none; }
    .camera-preview { width: 100%; max-height: 280px; border-radius: var(--radius-md); display: none; }
    .camera-tools { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
    .camera-tool-btn {
      padding: 7px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);
      background: var(--bg-tertiary); color: var(--text-primary); font-size: 12px; cursor: pointer;
      transition: all 0.2s;
    }
    .camera-tool-btn:hover { background: var(--accent); border-color: var(--accent); }
    .camera-tool-btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-light)); border: none; color: white; }
    .file-input { display: none; }

    /* ===== Credits Modal ===== */
    .credits-modal-body { font-size: 14px; }
    .credits-modal-body .credit-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid var(--border-color);
    }
    .credits-modal-body .credit-row:last-child { border-bottom: none; }
    .credits-modal-body .credit-label { color: var(--text-secondary); font-size: 13px; }
    .credits-modal-body .credit-cost { font-weight: 600; color: var(--gold); font-size: 13px; }

    /* ===== Overlay (mobile) ===== */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 30; }

    @media (max-width: 768px) {
      .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); width: 280px; }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: flex; align-items: center; justify-content: center; }
      .overlay.show { display: block; }
      .empty-grid { grid-template-columns: 1fr; }
      .msg-content-wrapper { max-width: 85%; }
      .modal { width: 92vw; padding: 18px; }
      .header-credits { padding: 4px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">🦋</div>
          <span class="logo-text">逆蝶AI</span>
        </div>
        <div class="credits-bar">
          <div class="credits-row">
            <span class="credits-label">可用积分</span>
            <span class="credits-value" id="sidebarCredits">0</span>
          </div>
          <div class="credits-progress">
            <div class="credits-fill" id="creditsFill" style="width:0%"></div>
          </div>
          <div class="credits-actions">
            <button class="credits-btn" id="checkinBtn" onclick="dailyCheckin()">📅 签到</button>
            <button class="credits-btn" onclick="openCreditsModal()">📊 详情</button>
          </div>
        </div>
        <button class="btn-new" id="btnNew">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
          新建对话
        </button>
      </div>
      <div class="conv-list" id="convList"><div class="conv-empty">暂无对话记录</div></div>
      <div class="sidebar-footer">逆蝶AI v3.0 · 对话 · 爬虫 · 识图 · 积分</div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="header">
        <button class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round"/></svg></button>
        <h1 class="header-title" id="headerTitle">逆蝶AI</h1>
        <div class="header-credits" onclick="openCreditsModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M9 9h4.5a2 2 0 0 1 0 4H9m0 4h4.5" stroke-linecap="round"/></svg>
          <span id="headerCredits">0</span>
        </div>
        <div class="status-badge" id="statusBadge" style="display:none"><span class="status-dot"></span>回复中</div>
      </header>

      <div class="error-bar" id="errorBar" style="display:none">
        <span id="errorText"></span>
        <button onclick="document.getElementById('errorBar').style.display='none'">✕</button>
      </div>

      <div class="messages" id="messages"><div class="messages-inner" id="messagesInner"></div></div>

      <div class="input-area">
        <div class="input-wrapper">
          <button class="tool-btn" id="crawlBtn" title="网页爬虫">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </button>
          <button class="tool-btn" id="cameraBtn" title="拍照识别">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </button>
          <div class="input" style="flex:1;"><textarea id="input" placeholder="输入消息，回车发送，Shift+回车换行" rows="1"></textarea></div>
          <button class="send-btn" id="sendBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <p class="input-hint">逆蝶AI 生成内容仅供参考 · 每次对话消耗积分</p>
      </div>
    </main>
  </div>

  <!-- Crawl Modal -->
  <div class="modal-overlay" id="crawlModal">
    <div class="modal">
      <h2 class="modal-title">🕷️ 网页爬虫</h2>
      <p class="modal-desc">输入网页地址，逆蝶AI将抓取网页内容并为你分析。（消耗 50 积分）</p>
      <input type="text" class="modal-input" id="crawlUrlInput" placeholder="https://example.com" />
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeModal('crawlModal')">取消</button>
        <button class="modal-btn confirm" id="crawlConfirmBtn" onclick="executeCrawl()">开始爬取</button>
      </div>
    </div>
  </div>

  <!-- Camera Modal -->
  <div class="modal-overlay" id="cameraModal">
    <div class="modal">
      <h2 class="modal-title">📷 图片识别</h2>
      <p class="modal-desc">拍照或上传图片，逆蝶AI将为你识别图片内容。（消耗 100 积分）</p>
      <div class="camera-container" id="cameraContainer">
        <video class="camera-video" id="cameraVideo" autoplay playsinline></video>
        <canvas class="camera-canvas" id="cameraCanvas"></canvas>
        <img class="camera-preview" id="cameraPreview" alt="预览" />
      </div>
      <div class="camera-tools" id="cameraTools">
        <button class="camera-tool-btn primary" id="captureBtn" onclick="capturePhoto()">📸 拍照</button>
        <button class="camera-tool-btn" onclick="switchCamera()">🔄 切换</button>
        <button class="camera-tool-btn" onclick="document.getElementById('fileInput').click()">📁 上传</button>
        <input type="file" class="file-input" id="fileInput" accept="image/*" />
      </div>
      <div class="modal-actions" style="margin-top:10px;">
        <button class="modal-btn cancel" onclick="closeCamera()">取消</button>
        <button class="modal-btn confirm" id="visionConfirmBtn" onclick="executeVision()" disabled>识别图片</button>
      </div>
    </div>
  </div>

  <!-- Credits Info Modal -->
  <div class="modal-overlay" id="creditsModal">
    <div class="modal">
      <h2 class="modal-title">📊 积分系统</h2>
      <p class="modal-desc" id="creditsModalDesc">您的积分余额</p>
      <div class="credits-modal-body">
        <div class="credit-row"><span class="credit-label">💬 每次对话</span><span class="credit-cost">-10 积分</span></div>
        <div class="credit-row"><span class="credit-label">🕷️ 网页爬虫</span><span class="credit-cost">-50 积分</span></div>
        <div class="credit-row"><span class="credit-label">📷 图片识别</span><span class="credit-cost">-100 积分</span></div>
        <div class="credit-row"><span class="credit-label">📅 每日签到</span><span class="credit-cost">+200 积分</span></div>
        <div class="credit-row"><span class="credit-label">🎁 新用户赠送</span><span class="credit-cost">+1000 积分</span></div>
      </div>
      <div class="modal-actions">
        <button class="modal-btn confirm" onclick="closeModal('creditsModal')">知道了</button>
      </div>
    </div>
  </div>

  <script>
    // ===================================================
    //  逆蝶AI v3.0 — 积分系统 + 智能知识库
    // ===================================================

    // ===== 积分配置 =====
    var CREDITS_CONFIG = {
      initial: 1000,
      dailyCheckin: 200,
      chatCost: 10,
      crawlCost: 50,
      visionCost: 100,
      maxCredits: 5000,
    };
    var CREDITS_KEY = 'niedie-ai-credits';
    var CHECKIN_KEY = 'niedie-ai-last-checkin';

    // ===== 积分管理 =====
    function loadCredits() {
      var c = parseInt(localStorage.getItem(CREDITS_KEY));
      if (isNaN(c) || c < 0) { c = CREDITS_CONFIG.initial; localStorage.setItem(CREDITS_KEY, c); }
      return c;
    }
    function saveCredits(v) {
      v = Math.max(0, Math.min(v, CREDITS_CONFIG.maxCredits));
      localStorage.setItem(CREDITS_KEY, v);
      updateCreditsDisplay();
    }
    function spendCredits(amount) {
      var cur = loadCredits();
      if (cur < amount) return false;
      saveCredits(cur - amount);
      return true;
    }
    function updateCreditsDisplay() {
      var c = loadCredits();
      var pct = Math.min(100, (c / CREDITS_CONFIG.maxCredits) * 100);
      document.getElementById('headerCredits').textContent = c;
      document.getElementById('sidebarCredits').textContent = c;
      document.getElementById('creditsFill').style.width = pct + '%';
      document.getElementById('creditsModalDesc').textContent = '当前余额：' + c + ' 积分';
    }
    function dailyCheckin() {
      var today = new Date().toDateString();
      var last = localStorage.getItem(CHECKIN_KEY);
      if (last === today) {
        var btn = document.getElementById('checkinBtn');
        btn.classList.add('checkin-done');
        btn.textContent = '✅ 已签到';
        return;
      }
      localStorage.setItem(CHECKIN_KEY, today);
      var cur = loadCredits();
      saveCredits(cur + CREDITS_CONFIG.dailyCheckin);
      var btn = document.getElementById('checkinBtn');
      btn.classList.add('checkin-done');
      btn.textContent = '✅ 已签到';
      showCreditsToast('签到成功！+' + CREDITS_CONFIG.dailyCheckin + ' 积分 🎉');
    }
    function checkCheckinStatus() {
      var today = new Date().toDateString();
      var last = localStorage.getItem(CHECKIN_KEY);
      if (last === today) {
        var btn = document.getElementById('checkinBtn');
        btn.classList.add('checkin-done');
        btn.textContent = '✅ 已签到';
      }
    }
    function showCreditsToast(msg) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--bg-tertiary);color:var(--gold);padding:10px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;border:1px solid rgba(251,191,36,0.3);box-shadow:0 4px 20px rgba(0,0,0,0.3);animation:fadeIn 0.3s ease;';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.5s'; setTimeout(function(){ toast.remove(); }, 500); }, 2500);
    }
    function openCreditsModal() { updateCreditsDisplay(); document.getElementById('creditsModal').classList.add('show'); }

    // ===== State =====
    var conversations = [];
    var activeId = null;
    var isStreaming = false;
    var capturedImage = null;
    var cameraStream = null;
    var cameraFacing = 'environment';

    // ===== DOM =====
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('overlay');
    var menuBtn = document.getElementById('menuBtn');
    var btnNew = document.getElementById('btnNew');
    var convList = document.getElementById('convList');
    var headerTitle = document.getElementById('headerTitle');
    var statusBadge = document.getElementById('statusBadge');
    var errorBar = document.getElementById('errorBar');
    var errorText = document.getElementById('errorText');
    var messages = document.getElementById('messages');
    var messagesInner = document.getElementById('messagesInner');
    var input = document.getElementById('input');
    var sendBtn = document.getElementById('sendBtn');

    // ===== Utils =====
    function genId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 11); }
    function escapeHtml(text) { var div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    function formatTime(ts) { var d = new Date(ts); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); }
    function generateTitle(content) { var t = content.trim(); return t.length <= 20 ? t : t.slice(0,20) + '...'; }

    // ===== Storage =====
    var STORAGE_KEY = 'niedie-ai-conversations';
    function loadConversations() {
      try { var data = localStorage.getItem(STORAGE_KEY); if (!data) return []; var p = JSON.parse(data); return Array.isArray(p) ? p : []; } catch { return []; }
    }
    function saveConversations() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations)); } catch(e) {} }

    // ===== Init =====
    function init() {
      loadCredits();
      checkCheckinStatus();
      conversations = loadConversations();
      if (conversations.length === 0) {
        try {
          var old = localStorage.getItem('ai-chat-conversations');
          if (old) { conversations = JSON.parse(old); saveConversations(); localStorage.removeItem('ai-chat-conversations'); }
        } catch {}
      }
      if (conversations.length > 0) activeId = conversations[0].id;
      updateCreditsDisplay();
      renderSidebar(); renderMessages(); bindEvents();
    }

    // ===== Render =====
    function renderSidebar() {
      if (conversations.length === 0) { convList.innerHTML = '<div class="conv-empty">暂无对话记录</div>'; return; }
      convList.innerHTML = conversations.map(function(c) {
        return '<div class="conv-item' + (c.id===activeId?' active':'') + '" data-id="'+c.id+'">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
          '<span>'+escapeHtml(c.title)+'</span>' +
          '<button class="conv-delete" data-delete="'+c.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>';
      }).join('');
      convList.querySelectorAll('.conv-item').forEach(function(item) {
        item.addEventListener('click', function(e) { if (e.target.closest('.conv-delete')) return; selectConversation(item.dataset.id); });
      });
      convList.querySelectorAll('.conv-delete').forEach(function(btn) {
        btn.addEventListener('click', function(e) { e.stopPropagation(); deleteConversation(btn.dataset.delete); });
      });
    }

    function renderMessages() {
      var conv = conversations.find(function(c){return c.id===activeId;});
      headerTitle.textContent = conv ? conv.title : '逆蝶AI';
      if (!conv || conv.messages.length === 0) {
        messagesInner.innerHTML =
          '<div class="empty-state"><div class="empty-icon">🦋</div>' +
          '<h2 class="empty-title">逆蝶AI</h2>' +
          '<p class="empty-desc">破茧而出的智能助手 · 对话 · 爬虫 · 识图</p>' +
          '<div class="empty-grid">' +
          '<div class="empty-card" data-suggestion="你好，介绍一下你自己"><div class="empty-card-icon">💡</div><div class="empty-card-title">知识问答</div><div class="empty-card-desc">问任何问题</div></div>' +
          '<div class="empty-card" data-suggestion="帮我写一首关于蝴蝶的诗"><div class="empty-card-icon">✍️</div><div class="empty-card-title">创意写作</div><div class="empty-card-desc">文案、故事、诗歌</div></div>' +
          '<div class="empty-card" data-crawl="1"><div class="empty-card-icon">🕷️</div><div class="empty-card-title">网页爬虫</div><div class="empty-card-desc">输入网址抓取内容</div></div>' +
          '<div class="empty-card" data-camera="1"><div class="empty-card-icon">📷</div><div class="empty-card-title">图片识别</div><div class="empty-card-desc">拍照或上传图片</div></div>' +
          '</div></div>';
        messagesInner.querySelectorAll('.empty-card').forEach(function(card) {
          card.addEventListener('click', function() {
            if (card.dataset.crawl) { openCrawlModal(); return; }
            if (card.dataset.camera) { openCameraModal(); return; }
            input.value = card.dataset.suggestion;
            input.dispatchEvent(new Event('input'));
            sendMessage();
          });
        });
        return;
      }
      var html = conv.messages.map(function(msg) {
        var isUser = msg.role === 'user';
        var bubbleClass = isUser ? '' : (msg.isError ? 'error' : '');
        var imgHtml = '';
        if (isUser && msg.image) { imgHtml = '<img class="msg-image" src="'+msg.image+'" alt="用户上传" />'; }
        var costHtml = (!isUser && msg.cost) ? '<span class="msg-cost">消耗 '+msg.cost+' 积分</span>' : '';
        return '<div class="msg-row'+(isUser?' user':'')+'">' +
          '<div class="msg-avatar'+(isUser?' user':' ai')+'">'+(isUser?'你':'🦋')+'</div>' +
          '<div class="msg-content-wrapper">' +
          (msg.content ? '<div class="msg-bubble'+(bubbleClass?' '+bubbleClass:'')+'">'+escapeHtml(msg.content)+'</div>' : '') +
          imgHtml +
          '<div style="display:flex;align-items:center;gap:8px;"><span class="msg-time">'+formatTime(msg.timestamp)+'</span>'+costHtml+'</div></div></div>';
      }).join('');
      if (isStreaming) {
        html += '<div class="typing-indicator"><div class="msg-avatar ai">🦋</div><div class="typing-dots"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>';
      }
      messagesInner.innerHTML = html;
      requestAnimationFrame(function() { messages.scrollTop = messages.scrollHeight; });
    }

    function showError(msg) { errorText.textContent = '⚠️ ' + msg; errorBar.style.display = 'flex'; }
    function hideError() { errorBar.style.display = 'none'; }
    function setStreaming(s) {
      isStreaming = s; statusBadge.style.display = s?'flex':'none'; sendBtn.disabled = s; input.disabled = s;
      input.placeholder = s ? '逆蝶AI 正在回复中...' : '输入消息，回车发送，Shift+回车换行';
    }

    // ===== Actions =====
    function newConversation() {
      var conv = { id: genId(), title: '新对话', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
      conversations.unshift(conv); activeId = conv.id; saveConversations(); renderSidebar(); renderMessages(); closeSidebar(); hideError();
    }
    function selectConversation(id) { activeId = id; renderSidebar(); renderMessages(); closeSidebar(); hideError(); }
    function deleteConversation(id) {
      conversations = conversations.filter(function(c){return c.id!==id;});
      if (activeId === id) activeId = conversations.length > 0 ? conversations[0].id : null;
      saveConversations(); renderSidebar(); renderMessages();
    }
    function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('show'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
    function getActiveConv() {
      var conv = conversations.find(function(c){return c.id===activeId;});
      if (!conv) { conv = { id: genId(), title: '新对话', messages: [], createdAt: Date.now(), updatedAt: Date.now() }; conversations.unshift(conv); activeId = conv.id; }
      return conv;
    }

    async function sendMessage() {
      var content = input.value.trim();
      if (!content || isStreaming) return;
      // 积分检查
      if (!spendCredits(CREDITS_CONFIG.chatCost)) {
        showCreditsToast('积分不足！请明日签到获取更多积分 💰');
        return;
      }
      hideError();
      var conv = getActiveConv();
      conv.messages.push({ id: genId(), role: 'user', content: content, timestamp: Date.now() });
      if (conv.messages.length === 1) conv.title = generateTitle(content);
      conv.updatedAt = Date.now();
      var aiMsg = { id: genId(), role: 'assistant', content: '', timestamp: Date.now(), cost: CREDITS_CONFIG.chatCost };
      conv.messages.push(aiMsg); conv.updatedAt = Date.now();
      saveConversations(); renderSidebar(); setStreaming(true); renderMessages();
      input.value = ''; input.style.height = 'auto';
      var history = conv.messages.slice(0, -1).map(function(m){return {role:m.role, content:m.content};});
      try {
        var response = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:content, history:history}) });
        if (!response.ok) { var e=null; try{e=await response.json();}catch{} throw new Error(e&&e.error?e.error:'请求失败 ('+response.status+')'); }
        if (!response.body) throw new Error('服务器未返回数据流');
        var reader = response.body.getReader(); var decoder = new TextDecoder(); var acc = '';
        while(true) { var r = await reader.read(); if (r.done) break; acc += decoder.decode(r.value,{stream:true}); aiMsg.content = acc; renderMessages(); }
        if (!acc.trim()) throw new Error('AI未返回有效内容');
        aiMsg.content = acc; conv.updatedAt = Date.now(); saveConversations();
      } catch(err) {
        var reply = clientSmartReply(content, history);
        streamClientReply(reply, aiMsg, conv);
        return;
      } finally { setStreaming(false); renderMessages(); renderSidebar(); }
    }

    // ===== Crawl =====
    function openCrawlModal() {
      if (loadCredits() < CREDITS_CONFIG.crawlCost) { showCreditsToast('积分不足！爬虫需要 '+CREDITS_CONFIG.crawlCost+' 积分 💰'); return; }
      document.getElementById('crawlModal').classList.add('show'); document.getElementById('crawlUrlInput').focus();
    }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    async function executeCrawl() {
      var url = document.getElementById('crawlUrlInput').value.trim();
      if (!url) { showError('请输入网页地址'); return; }
      if (!spendCredits(CREDITS_CONFIG.crawlCost)) { showCreditsToast('积分不足！💰'); return; }
      var btn = document.getElementById('crawlConfirmBtn');
      btn.disabled = true; btn.textContent = '爬取中...';
      try {
        var response = await fetch('/api/crawl', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url:url}) });
        var data = await response.json();
        if (!response.ok) throw new Error(data.error||'爬取失败');
        closeModal('crawlModal');
        document.getElementById('crawlUrlInput').value = '';
        var conv = getActiveConv();
        var crawlText = '🕷️ 网页爬虫结果\n\n网址: '+data.url+'\n标题: '+data.title;
        if (data.description) crawlText += '\n描述: '+data.description;
        if (data.keywords) crawlText += '\n关键词: '+data.keywords;
        crawlText += '\n\n--- 网页内容 ---\n'+data.content.slice(0, 3000);
        if (data.content.length > 3000) crawlText += '\n...(内容已截断，共'+data.contentLength+'字符)';
        crawlText += '\n\n请分析以上网页内容，给出简要总结。';
        conv.messages.push({ id: genId(), role: 'user', content: '🕷️ 爬取网页: '+url, timestamp: Date.now() });
        if (conv.messages.length === 1) conv.title = generateTitle('爬虫: '+data.title);
        var aiMsg = { id: genId(), role: 'assistant', content: '', timestamp: Date.now(), cost: CREDITS_CONFIG.crawlCost };
        conv.messages.push(aiMsg); conv.updatedAt = Date.now(); saveConversations(); renderSidebar(); setStreaming(true); renderMessages();
        var history = conv.messages.slice(0, -1).map(function(m){return {role:m.role, content:m.content};});
        try {
          var resp = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:crawlText, history:history}) });
          if (!resp.ok) throw new Error('分析失败');
          var reader = resp.body.getReader(); var dec = new TextDecoder(); var acc = '';
          while(true){ var r=await reader.read(); if(r.done)break; acc+=dec.decode(r.value,{stream:true}); aiMsg.content=acc; renderMessages(); }
          if(!acc.trim()) throw new Error('AI未返回内容');
          aiMsg.content = acc; saveConversations();
        } catch(e) {
          var reply = clientSmartReply(crawlText, history);
          streamClientReply(reply, aiMsg, conv);
        }
      } catch(err) {
        closeModal('crawlModal');
        var conv = getActiveConv();
        conv.messages.push({ id: genId(), role: 'user', content: '🕷️ 爬取网页: '+url, timestamp: Date.now() });
        var aiMsg = { id: genId(), role: 'assistant', content: '', timestamp: Date.now(), cost: CREDITS_CONFIG.crawlCost };
        conv.messages.push(aiMsg); conv.updatedAt = Date.now(); saveConversations(); renderSidebar(); setStreaming(true); renderMessages();
        var reply = "⚠️ 爬虫功能需要后端服务支持。\n\n当前为静态部署模式，爬虫功能不可用。\n如需使用爬虫功能，请在本地运行：\n```\nnode server.js\n```\n然后访问 http://localhost:3000";
        streamClientReply(reply, aiMsg, conv);
      }
      finally { btn.disabled = false; btn.textContent = '开始爬取'; }
    }

    // ===== Camera / Vision =====
    function openCameraModal() {
      if (loadCredits() < CREDITS_CONFIG.visionCost) { showCreditsToast('积分不足！图片识别需要 '+CREDITS_CONFIG.visionCost+' 积分 💰'); return; }
      document.getElementById('cameraModal').classList.add('show');
      document.getElementById('cameraPreview').style.display = 'none';
      document.getElementById('cameraVideo').style.display = 'block';
      document.getElementById('captureBtn').style.display = 'block';
      capturedImage = null;
      document.getElementById('visionConfirmBtn').disabled = true;
      startCamera();
    }
    async function startCamera() {
      try {
        if (cameraStream) { cameraStream.getTracks().forEach(function(t){t.stop();}); }
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: cameraFacing }, audio: false });
        document.getElementById('cameraVideo').srcObject = cameraStream;
      } catch(err) {
        document.getElementById('cameraVideo').style.display = 'none';
        document.getElementById('captureBtn').style.display = 'none';
      }
    }
    function switchCamera() { cameraFacing = cameraFacing === 'environment' ? 'user' : 'environment'; startCamera(); }
    function capturePhoto() {
      var video = document.getElementById('cameraVideo');
      var canvas = document.getElementById('cameraCanvas');
      var captureBtn = document.getElementById('captureBtn');
      if (capturedImage && video.style.display === 'none') {
        capturedImage = null;
        document.getElementById('cameraPreview').style.display = 'none';
        video.style.display = 'block';
        captureBtn.textContent = '📸 拍照';
        document.getElementById('visionConfirmBtn').disabled = true;
        return;
      }
      if (video.videoWidth === 0) { showError('摄像头未就绪，请尝试上传图片'); return; }
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      capturedImage = canvas.toDataURL('image/jpeg', 0.8);
      var preview = document.getElementById('cameraPreview');
      preview.src = capturedImage; preview.style.display = 'block';
      video.style.display = 'none';
      captureBtn.textContent = '📸 重新拍';
      document.getElementById('visionConfirmBtn').disabled = false;
    }
    function closeCamera() {
      document.getElementById('cameraModal').classList.remove('show');
      if (cameraStream) { cameraStream.getTracks().forEach(function(t){t.stop();}); cameraStream = null; }
      capturedImage = null;
    }
    async function executeVision() {
      if (!capturedImage) { showError('请先拍照或上传图片'); return; }
      if (!spendCredits(CREDITS_CONFIG.visionCost)) { showCreditsToast('积分不足！💰'); return; }
      closeCamera();
      var conv = getActiveConv();
      conv.messages.push({ id: genId(), role: 'user', content: '📷 请识别这张图片', image: capturedImage, timestamp: Date.now() });
      if (conv.messages.length === 1) conv.title = '图片识别';
      var aiMsg = { id: genId(), role: 'assistant', content: '', timestamp: Date.now(), cost: CREDITS_CONFIG.visionCost };
      conv.messages.push(aiMsg); conv.updatedAt = Date.now(); saveConversations(); renderSidebar(); setStreaming(true); renderMessages();
      try {
        var response = await fetch('/api/vision', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({image: capturedImage}) });
        var data = await response.json();
        if (!response.ok) throw new Error(data.error||'识别失败');
        var text = data.result; var chars = Array.from(text); var i = 0;
        var interval = setInterval(function() {
          if (i < chars.length) { aiMsg.content = chars.slice(0, i+2).join(''); i += 2; renderMessages(); }
          else { clearInterval(interval); aiMsg.content = text; conv.updatedAt = Date.now(); saveConversations(); setStreaming(false); renderMessages(); renderSidebar(); }
        }, 25);
      } catch(err) {
        var reply = "⚠️ 图片识别功能需要后端服务支持。\n\n当前为静态部署模式，图片识别不可用。\n如需使用图片识别功能，请在本地运行：\n```\nnode server.js\n```\n然后访问 http://localhost:3000";
        streamClientReply(reply, aiMsg, conv);
      }
    }

    // ===================================================
    //  智能知识库 — 训练数据
    // ===================================================
    function clientSmartReply(message, history) {
      var msg = message.toLowerCase().trim();
      var m = message.trim();

      // --- 问候类 ---

        return "🍳 推荐一道简单的菜：**番茄炒蛋**\n\n**材料：** 番茄 2 个、鸡蛋 3 个、盐、糖、葱\n\n**步骤：**\n1. 鸡蛋打散加少许盐，番茄切块\n2. 热锅倒油，蛋液炒至凝固盛出\n3. 锅中放番茄翻炒出汁\n4. 加盐和少许糖调味\n5. 倒入鸡蛋翻炒均匀即可\n\n💡 番茄炒蛋是中国最常见的家常菜之一！";
      }
      if (/(推荐.*吃|吃.*什么|美食|好吃的)/i.test(msg)) {
        return "🍽️ 美食推荐：\n\n🇨🇳 **中餐：** 火锅、烤鸭、小笼包、麻婆豆腐\n🍣 **日料：** 寿司、拉面、天妇罗\n🍝 **西餐：** 牛排、意面、披萨\n🍜 **东南亚：** 泰式冬阴功、越南河粉\n🍰 **甜点：** 提拉米苏、舒芙蕾、杨枝甘露\n\n你更喜欢哪种口味？";
      }

      // --- 旅行 ---
      if (/(旅游|旅行|travel|去哪玩|推荐.*景点)/i.test(msg)) {
        return "✈️ 旅行推荐：\n\n🏔️ **国内：**\n- 西藏 — 圣洁的高原\n- 云南 — 多彩的民族风情\n- 新疆 — 壮美的自然风光\n- 杭州 — 西湖美景\n- 成都 — 美食与熊猫\n\n🌍 **国际：**\n- 日本 — 樱花与温泉\n- 冰岛 — 极光与火山\n- 新西兰 — 中土世界\n- 瑞士 — 阿尔卑斯山\n\n你想去什么类型的地方？";
      }

      // --- 健康 ---
      if (/(减肥|瘦身|weight loss|瘦)/i.test(msg)) {
        return "💪 健康减肥建议：\n\n1. **控制饮食** — 减少高糖高油食物，多吃蔬菜蛋白质\n2. **规律运动** — 每周 3-5 次有氧运动（跑步、游泳等）\n3. **充足睡眠** — 每天 7-8 小时\n4. **多喝水** — 每天至少 1.5 升\n5. **坚持** — 减肥是持久战，不要急于求成\n\n⚠️ 建议咨询专业医生或营养师。";
      }
      if (/(失眠|睡不着|sleep|睡眠)/i.test(msg)) {
        return "😴 改善睡眠的建议：\n\n1. 睡前 1 小时远离手机和电脑\n2. 保持规律作息，同一时间上床\n3. 睡前避免咖啡因和大量进食\n4. 卧室保持安静、黑暗、凉爽\n5. 尝试冥想或深呼吸放松\n6. 白天适当运动，但避免睡前剧烈运动\n\n如果长期失眠，建议就医。";
      }

      // --- 日常小工具 ---
      if (/(随机|random|随机数)/i.test(msg)) {
        return "🎲 随机数：" + Math.floor(Math.random() * 100) + "（1-100）";
      }
      if (/(抛硬币|硬币|flip coin)/i.test(msg)) {
        return Math.random() < 0.5 ? "🪙 正面！" : "🪙 反面！";
      }
      if (/(今天.*运|运势|运气|fortune|luck)/i.test(msg)) {
        var fortunes = ["🌟 今日运势大吉！好事将近，把握机会。","⭐ 今日运势中吉。平稳为主，小有收获。","☁️ 今日运势平稳。保持低调，蓄势待发。","🌈 今日贵人运旺！多与人交流，会有惊喜。","🍀 今日幸运色：紫色。幸运数字：" + Math.floor(Math.random()*9+1)];
        return fortunes[m.length % fortunes.length];
      }

      // --- 哲学/励志 ---
      if (/(人生.*意义|活.*意义|meaning of life)/i.test(msg)) {
        return "🤔 关于人生的意义，每个人可能有不同的答案：\n\n- 有人说是**追求幸福**\n- 有人说是**实现自我**\n- 有人说是**爱与被爱**\n- 有人说是**创造价值**\n- 也有人认为人生**本无意义**，意义是自己赋予的\n\n💡 也许重要的不是「意义是什么」，而是「你选择了什么意义」。";
      }
      if (/(激励|鼓励|motivat|打气|加油|坚持)/i.test(msg)) {
        var motiv = ["💪 你比你想象的更强大！每一次跌倒都是为了更好地站起来。","🌟 坚持下去，成功就在不远处。逆蝶之所以叫逆蝶，就是逆风也要飞翔！","🔥 没有人能随随便便成功。但每一步都算数，每一天都在靠近目标。","🦋 破茧成蝶的过程很痛，但绽放的那一刻，一切都值得。"];
        return motiv[m.length % motiv.length];
      }

      // --- 闲聊 ---
      if (/(无聊|好无聊|boring|bored)/i.test(msg)) {
        return "无聊的话，要不要试试这些？\n\n🎮 让我讲个笑话\n✍️ 让我写首诗或故事\n🧠 让我出个谜语\n📖 聊聊你感兴趣的话题\n🌍 问问科学、历史、地理知识\n\n选一个吧！🦋";
      }
      if (/(喜欢|love|爱好|hobby|兴趣)/i.test(msg) && /你|逆蝶/i.test(msg)) {
        return "我虽然是 AI，但如果说我「喜欢」什么的话：\n\n💜 和人聊天，感受不同的想法\n🦋 帮别人解决问题\n📖 学习新知识\n✨ 创造有趣的文字\n\n那你呢？你喜欢什么？";
      }
      if (/(吃了吗|吃饭|饭了吗)/i.test(msg)) return "我是 AI，不需要吃饭 😄 但你可以去吃点好吃的！推荐：火锅、烤肉、寿司、小笼包～";
      if (/(天气.*热|好热|太热)/i.test(msg)) return "确实热！🥵 记得多喝水，避免长时间户外活动。来杯冰西瓜汁？🍉";
      if (/(天气.*冷|好冷|太冷)/i.test(msg)) return "天冷要注意保暖！🧣 多穿衣服，喝点热茶或热可可。";
      if (/(你是.*男.*女|男生.*女生|性别|gender)/i.test(msg)) return "我是 AI，没有性别 😄 不过你可以叫我「逆蝶」，像一只中性但优雅的蝴蝶 🦋";

      // --- 技术相关 ---
      if (/(html|css|javascript|js|前端|frontend|web.*开发)/i.test(msg)) {
        return "💻 **前端开发三件套：**\n\n- **HTML** — 页面结构（骨架）\n- **CSS** — 页面样式（皮肤）\n- **JavaScript** — 页面交互（灵魂）\n\n逆蝶AI 的前端就是用这三个技术写的，全部在单个 HTML 文件中！\n\n**进阶学习：**\n- 框架：React / Vue / Svelte\n- 构建工具：Vite / Webpack\n- 样式：Tailwind / Sass";
      }
      if (/(python|爬虫|crawl|scraping)/i.test(msg)) {
        return "🐍 **Python 爬虫常用库：**\n\n- **requests** — 发送 HTTP 请求\n- **BeautifulSoup** — 解析 HTML\n- **Scrapy** — 专业爬虫框架\n- **Selenium** — 模拟浏览器操作\n- **Playwright** — 现代浏览器自动化\n\n⚠️ 爬虫请注意遵守网站的 robots.txt 和法律法规。";
      }
      if (/(node\.?js|node|后端|backend|服务器)/i.test(msg)) {
        return "🟢 **Node.js** 是基于 V8 引擎的 JavaScript 运行时。\n\n逆蝶AI 的后端就是用 Node.js 写的，零依赖，只用内置模块！\n\n**常用框架：**\n- Express — 最流行的 Web 框架\n- Koa — 更轻量\n- Fastify — 高性能\n- Nest.js — 企业级";
      }

      // --- 语言翻译/学习 ---
      if (/(翻译|translate|english|英语|怎么说)/i.test(msg)) {
        return "💬 常用英语短语：\n\n- 你好 — Hello / Hi\n- 谢谢 — Thank you\n- 对不起 — Sorry\n- 没关系 — It's OK / Never mind\n- 再见 — Goodbye / See you\n- 我爱你 — I love you\n- 加油 — Come on / You can do it\n\n告诉我你想翻译的具体内容，我可以帮你！";
      }

      // --- 兜底回复（更智能） ---
      // 分析消息特征
      if (msg.endsWith('?') || msg.endsWith('？')) {
        return "关于「" + m + "」\n\n这是一个很好的问题！让我从几个角度来分析：\n\n1. 这个问题可能涉及多个层面，需要具体场景来判断\n2. 如果你能提供更多背景信息，我可以给出更有针对性的回答\n3. 你也可以尝试换个方式提问，或者分解成更小的子问题\n\n💡 配置 OPENAI_API_KEY 后，我能接入完整的 AI 模型，提供更深入的回答。";
      }
      if (msg.length < 5) {
        return "你说的「" + m + "」...能再详细一点吗？这样我能更好地帮你 😊";
      }

      var replies = [
        "关于「" + m + "」，我来说说我的理解：\n\n这个话题挺有意思的。虽然我目前是演示模式，但我可以尝试从不同角度和你探讨。你能告诉我更多背景吗？比如你是在什么场景下遇到这个问题的？",
        "收到你的消息：「" + m + "」\n\n我想更好地帮助你，能补充一些细节吗？比如：\n- 你希望我回答什么方面的内容？\n- 这是什么场景下的问题？\n- 你期望得到什么形式的结果？",
        "「" + m + "」— 这个问题值得深入聊聊！\n\n从我的知识库来看，这涉及几个方面。不过为了给你最有用的回答，能告诉我你更关心哪个角度吗？",
        "我注意到你提到了「" + m + "」。\n\n如果你是在寻求具体建议，可以告诉我更多上下文。如果你想闲聊，那也很好！随时继续～ 🦋",
        "嗯，「" + m + "」...\n\n让我想想。这个问题可能有多种理解方式。你是在问事实知识，还是在寻求建议，或者只是想聊聊？告诉我你的想法，我们一起探讨。"
      ];
      return replies[m.length % replies.length];
    }

    function streamClientReply(reply, aiMsg, conv) {
      if (!reply) { setStreaming(false); return; }
      var chars = Array.from(reply); var i = 0;
      var interval = setInterval(function() {
        if (i < chars.length) { aiMsg.content = chars.slice(0, i+2).join(''); i += 2; renderMessages(); }
        else { clearInterval(interval); aiMsg.content = reply; conv.updatedAt = Date.now(); saveConversations(); setStreaming(false); renderMessages(); renderSidebar(); }
      }, 30);
    }

    // ===== Events =====
    function bindEvents() {
      btnNew.addEventListener('click', newConversation);
      menuBtn.addEventListener('click', openSidebar);
      overlay.addEventListener('click', closeSidebar);
      sendBtn.addEventListener('click', sendMessage);
      document.getElementById('crawlBtn').addEventListener('click', openCrawlModal);
      document.getElementById('cameraBtn').addEventListener('click', openCameraModal);
      document.getElementById('crawlUrlInput').addEventListener('keydown', function(e) { if (e.key==='Enter') executeCrawl(); });
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });
      input.addEventListener('input', function() {
        this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        sendBtn.disabled = !this.value.trim() || isStreaming;
      });
      var fileInput = document.getElementById('fileInput');
      if (fileInput) {
        fileInput.addEventListener('change', function(e) {
          var file = e.target.files[0];
          if (!file) return;
          if (file.size > 20*1024*1024) { showError('图片不能超过20MB'); return; }
          var reader = new FileReader();
          reader.onload = function(ev) {
            capturedImage = ev.target.result;
            var preview = document.getElementById('cameraPreview');
            preview.src = capturedImage; preview.style.display = 'block';
            document.getElementById('cameraVideo').style.display = 'none';
            document.getElementById('captureBtn').textContent = '📸 拍照';
            document.getElementById('visionConfirmBtn').disabled = false;
          };
          reader.readAsDataURL(file);
        });
      }
      document.getElementById('crawlModal').addEventListener('click', function(e) { if (e.target === this) closeModal('crawlModal'); });
      document.getElementById('cameraModal').addEventListener('click', function(e) { if (e.target === this) closeCamera(); });
      document.getElementById('creditsModal').addEventListener('click', function(e) { if (e.target === this) closeModal('creditsModal'); });
    }

    // ===== Boot =====
    init();
  </script>
</body>
</html>
