<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>逆蝶AI v6.0</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0a0a12;
      --bg-secondary: #15151f;
      --bg-tertiary: #1e1e2e;
      --bg-hover: #252535;
      --accent: #7c5ce7;
      --accent-light: #a29bfe;
      --accent-glow: rgba(124, 92, 231, 0.15);
      --text-primary: #e8e8f0;
      --text-secondary: #9999aa;
      --text-muted: #5a5a6a;
      --border-color: #2a2a3a;
      --red: #ef4444;
      --blue: #3b82f6;
      --green: #22c55e;
      --gold: #fbbf24;
      --orange: #f97316;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a5a; }
    ::selection { background: rgba(124, 92, 231, 0.3); }

    .app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 250px; height: 100%; background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: transform 0.3s ease;
    }
    .sidebar-header {
      padding: 16px; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-logo { font-size: 24px; }
    .sidebar-title { font-size: 16px; font-weight: 700; }
    .sidebar-version { font-size: 10px; color: var(--text-muted); margin-left: auto; }

    .new-chat-btn {
      margin: 12px; padding: 10px 14px;
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius-md); cursor: pointer;
      font-size: 14px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background 0.2s, transform 0.1s;
    }
    .new-chat-btn:hover { background: #6b4dd7; }
    .new-chat-btn:active { transform: scale(0.97); }

    .conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .conv-item {
      padding: 10px 12px; border-radius: var(--radius-sm);
      cursor: pointer; margin-bottom: 2px; font-size: 13px;
      color: var(--text-secondary);
      display: flex; align-items: center; gap: 8px;
      transition: background 0.15s;
    }
    .conv-item:hover { background: var(--bg-hover); }
    .conv-item.active { background: var(--bg-tertiary); color: var(--text-primary); }
    .conv-item .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv-item .conv-del { opacity: 0; font-size: 16px; color: var(--text-muted); transition: opacity 0.2s; }
    .conv-item:hover .conv-del { opacity: 1; }
    .conv-item .conv-del:hover { color: var(--red); }

    /* Model Selector */
    .model-section { padding: 12px; border-top: 1px solid var(--border-color); }
    .model-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .model-select {
      width: 100%; padding: 8px 10px; background: var(--bg-tertiary);
      border: 1px solid var(--border-color); border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 13px; cursor: pointer;
    }
    .model-select:focus { outline: none; border-color: var(--accent); }
    .model-info { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

    /* Credits Bar */
    .credits-section { padding: 12px; border-top: 1px solid var(--border-color); }
    .credits-bar {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .credits-icon { font-size: 18px; }
    .credits-amount { font-size: 16px; font-weight: 700; color: var(--gold); }
    .credits-max { font-size: 11px; color: var(--text-muted); }
    .credits-progress {
      height: 4px; background: var(--bg-tertiary); border-radius: 2px; overflow: hidden; margin-bottom: 8px;
    }
    .credits-fill {
      height: 100%; background: linear-gradient(90deg, var(--gold), var(--orange));
      border-radius: 2px; transition: width 0.3s ease;
    }
    .credits-actions { display: flex; gap: 6px; }
    .credits-btn {
      flex: 1; padding: 6px 8px; font-size: 11px; border: none;
      border-radius: var(--radius-sm); cursor: pointer; font-weight: 600;
    }
    .checkin-btn { background: var(--accent); color: #fff; }
    .checkin-btn:hover { background: #6b4dd7; }
    .checkin-btn:disabled { background: var(--bg-hover); color: var(--text-muted); cursor: not-allowed; }
    .credits-detail-btn { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-color) !important; }
    .credits-detail-btn:hover { background: var(--bg-hover); }

    /* ===== Main ===== */
    .main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
    .header {
      height: 52px; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 600; }
    .header-badge {
      padding: 2px 8px; font-size: 10px; font-weight: 700;
      border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-online { background: rgba(34, 197, 94, 0.15); color: var(--green); }
    .badge-loading { background: rgba(251, 191, 36, 0.15); color: var(--gold); }
    .badge-offline { background: rgba(239, 68, 68, 0.15); color: var(--red); }

    .header-credits {
      margin-left: auto; display: flex; align-items: center; gap: 4px;
      padding: 4px 10px; background: rgba(251, 191, 36, 0.1);
      border-radius: 12px; cursor: pointer; transition: background 0.2s;
    }
    .header-credits:hover { background: rgba(251, 191, 36, 0.2); }
    .header-credits .credits-icon { font-size: 14px; }
    .header-credits .credits-num { font-size: 13px; font-weight: 700; color: var(--gold); }

    .sidebar-toggle {
      display: none; background: none; border: none; color: var(--text-primary);
      font-size: 20px; cursor: pointer; padding: 4px;
    }

    /* Messages */
    .messages {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: 80%; padding: 12px 16px; border-radius: var(--radius-md);
      font-size: 14px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap;
      position: relative;
    }
    .msg-user {
      align-self: flex-end; background: var(--accent); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-ai {
      align-self: flex-start; background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }
    .msg-system {
      align-self: center; background: transparent; color: var(--text-muted);
      font-size: 12px; text-align: center; max-width: 90%;
    }
    .msg-cost {
      display: block; font-size: 10px; color: var(--text-muted);
      margin-top: 4px; text-align: right;
    }
    .msg-img { max-width: 200px; max-height: 200px; border-radius: var(--radius-sm); margin-top: 6px; }

    .typing-indicator {
      align-self: flex-start; padding: 12px 16px; background: var(--bg-secondary);
      border: 1px solid var(--border-color); border-radius: var(--radius-md);
      border-bottom-left-radius: 4px; display: flex; gap: 4px;
    }
    .typing-dot {
      width: 7px; height: 7px; background: var(--text-muted); border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

    /* Model Loading Progress */
    .model-loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 18, 0.95); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    }
    .model-loading .spinner {
      width: 48px; height: 48px; border: 3px solid var(--bg-tertiary);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .model-loading .title { font-size: 18px; font-weight: 700; }
    .model-loading .progress-bar {
      width: 300px; max-width: 80vw; height: 6px;
      background: var(--bg-tertiary); border-radius: 3px; overflow: hidden;
    }
    .model-loading .progress-fill {
      height: 100%; background: var(--accent); border-radius: 3px;
      transition: width 0.3s ease; width: 0%;
    }
    .model-loading .progress-text { font-size: 12px; color: var(--text-secondary); max-width: 400px; text-align: center; padding: 0 20px; }
    .model-loading .cancel-btn {
      padding: 8px 20px; background: var(--bg-tertiary); border: 1px solid var(--border-color);
      color: var(--text-secondary); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
    }
    .model-loading .cancel-btn:hover { background: var(--bg-hover); }

    /* Input */
    .input-area {
      padding: 12px 16px; border-top: 1px solid var(--border-color);
      display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
    }
    .input-tools { display: flex; gap: 4px; }
    .tool-btn {
      width: 36px; height: 36px; border: 1px solid var(--border-color);
      background: var(--bg-secondary); color: var(--text-secondary);
      border-radius: var(--radius-sm); cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .tool-btn:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--text-primary); }
    .tool-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .input-wrapper {
      flex: 1; display: flex; align-items: flex-end;
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .input-wrapper textarea {
      flex: 1; padding: 10px 14px; background: transparent; border: none;
      color: var(--text-primary); font-size: 14px; font-family: inherit;
      resize: none; outline: none; max-height: 120px; min-height: 40px; line-height: 1.5;
    }
    .input-wrapper textarea::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 36px; height: 36px; margin: 2px;
      background: var(--accent); border: none; color: #fff;
      border-radius: var(--radius-sm); cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
    .send-btn:hover { background: #6b4dd7; }
    .send-btn:active { transform: scale(0.92); }
    .send-btn:disabled { background: var(--bg-hover); color: var(--text-muted); cursor: not-allowed; }

    /* Camera Modal */
    .camera-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85); z-index: 1000;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    .camera-modal.active { display: flex; }
    .camera-modal video {
      max-width: 90vw; max-height: 70vh; border-radius: var(--radius-md);
      transform: scaleX(-1);
    }
    .camera-modal .camera-actions { display: flex; gap: 12px; }
    .camera-modal .cam-btn {
      padding: 10px 24px; border: none; border-radius: var(--radius-md);
      cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .cam-btn-capture { background: var(--accent); color: #fff; }
    .cam-btn-close { background: var(--bg-tertiary); color: var(--text-primary); }

    /* Credits Modal */
    .credits-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6); z-index: 1000; backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
    }
    .credits-modal.active { display: flex; }
    .credits-modal-content {
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 24px; width: 360px; max-width: 90vw;
    }
    .credits-modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .credits-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    .credits-row:last-child { border-bottom: none; }
    .credits-row .label { color: var(--text-secondary); }
    .credits-row .value { font-weight: 600; }
    .credits-close-btn {
      width: 100%; margin-top: 16px; padding: 10px;
      background: var(--bg-tertiary); border: 1px solid var(--border-color);
      color: var(--text-primary); border-radius: var(--radius-md); cursor: pointer; font-size: 14px;
    }
    .credits-close-btn:hover { background: var(--bg-hover); }

    /* Toast */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: var(--bg-tertiary); color: var(--text-primary);
      padding: 10px 20px; border-radius: var(--radius-md);
      border: 1px solid var(--border-color); font-size: 13px;
      z-index: 2000; opacity: 0; transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
    .toast.error { border-color: var(--red); }
    .toast.success { border-color: var(--green); }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed; z-index: 100; transform: translateX(-100%);
        box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-toggle { display: flex; }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">🦋</span>
        <span class="sidebar-title">逆蝶AI</span>
        <span class="sidebar-version">v6.0</span>
      </div>

      <button class="new-chat-btn" onclick="newConversation()">
        <span>✚</span> 新对话
      </button>

      <div class="conv-list" id="convList"></div>

      <!-- Model Selector -->
      <div class="model-section">
        <div class="model-label">🧠 AI 模型</div>
        <select class="model-select" id="modelSelect" onchange="switchModel()">
          <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5 1.5B (868MB·中文最佳)</option>
          <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen2.5 0.5B (278MB·极速)</option>
          <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B (712MB·均衡)</option>
          <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama 3.2 3B (1.76GB·更强)</option>
          <option value="Qwen2.5-3B-Instruct-q4f16_1-MLC">Qwen2.5 3B (1.7GB·高质量)</option>
          <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi 3.5 mini (2.1GB·推理强)</option>
          <option value="gemma-2-2b-it-q4f16_1-MLC">Gemma 2 2B (1.44GB·Google)</option>
          <option value="rule-based">规则模式（无需GPU）</option>
          <option value="brain">🧠 手搓AI v6.0 (纯JS神经网络·位置编码+残差连接·250+训练数据)</option>
        </select>
        <div class="model-info" id="modelInfo">首次加载需下载模型，之后缓存。手搓AI需训练后使用</div>
        <!-- 手搓AI训练面板 -->
        <div id="brainPanel" style="display:none;margin-top:8px;">
          <button class="credits-btn checkin-btn" id="trainBtn" style="width:100%;margin-bottom:6px;" onclick="startBrainTraining()">🔁 重新训练（可选）</button>
          <div id="trainProgress" style="font-size:11px;color:var(--text-muted);"></div>
          <div style="height:4px;background:var(--bg-tertiary);border-radius:2px;overflow:hidden;margin-top:4px;">
            <div id="trainBar" style="height:100%;background:var(--accent);width:0%;transition:width 0.3s;"></div>
          </div>
        </div>
      </div>

      <!-- Credits -->
      <div class="credits-section">
        <div class="credits-bar">
          <span class="credits-icon">💎</span>
          <span class="credits-amount" id="sidebarCredits">1000</span>
          <span class="credits-max">/ 5000</span>
        </div>
        <div class="credits-progress">
          <div class="credits-fill" id="creditsFill" style="width: 20%"></div>
        </div>
        <div class="credits-actions">
          <button class="credits-btn checkin-btn" id="checkinBtn" onclick="dailyCheckin()">📋 签到+200</button>
          <button class="credits-btn credits-detail-btn" onclick="openCreditsModal()">详情</button>
        </div>
      </div>
    </div>

    <!-- Main -->
    <div class="main">
      <div class="header">
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <span class="header-title">逆蝶AI</span>
        <span class="header-badge badge-offline" id="statusBadge">未加载</span>
        <div class="header-credits" onclick="openCreditsModal()">
          <span class="credits-icon">💎</span>
          <span class="credits-num" id="headerCredits">1000</span>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <div class="input-tools">
          <button class="tool-btn" id="crawlBtn" onclick="toggleCrawlMode()" title="网页爬虫">🕷️</button>
          <button class="tool-btn" id="cameraBtn" onclick="openCamera()" title="拍照识别">📷</button>
          <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileUpload(event)">
          <button class="tool-btn" onclick="document.getElementById('fileInput').click()" title="上传图片">🖼️</button>
        </div>
        <div class="input-wrapper">
          <textarea id="input" rows="1" placeholder="输入消息... (Enter发送, Shift+Enter换行)"
            oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="handleSend()" title="发送">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Camera Modal -->
  <div class="camera-modal" id="cameraModal">
    <video id="cameraVideo" autoplay playsinline></video>
    <div class="camera-actions">
      <button class="cam-btn cam-btn-capture" onclick="capturePhoto()">📸 拍照</button>
      <button class="cam-btn cam-btn-close" onclick="closeCamera()">关闭</button>
    </div>
  </div>

  <!-- Credits Modal -->
  <div class="credits-modal" id="creditsModal">
    <div class="credits-modal-content">
      <div class="credits-modal-title">💎 积分详情</div>
      <div class="credits-row">
        <span class="label">当前积分</span>
        <span class="value" id="modalCurrentCredits" style="color: var(--gold)">1000</span>
      </div>
      <div class="credits-row">
        <span class="label">积分上限</span>
        <span class="value">5000</span>
      </div>
      <div class="credits-row">
        <span class="label">每日签到</span>
        <span class="value" style="color: var(--green)">+200</span>
      </div>
      <div class="credits-row">
        <span class="label">对话消耗</span>
        <span class="value" style="color: var(--orange)">-10</span>
      </div>
      <div class="credits-row">
        <span class="label">爬虫消耗</span>
        <span class="value" style="color: var(--orange)">-50</span>
      </div>
      <div class="credits-row">
        <span class="label">图片识别消耗</span>
        <span class="value" style="color: var(--orange)">-100</span>
      </div>
      <div class="credits-row">
        <span class="label">上次签到</span>
        <span class="value" id="modalLastCheckin">未签到</span>
      </div>
      <button class="credits-close-btn" onclick="closeCreditsModal()">关闭</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Model Loading Overlay -->
  <div class="model-loading" id="modelLoading" style="display:none">
    <div class="spinner"></div>
    <div class="title" id="loadingTitle">正在加载 AI 模型...</div>
    <div class="progress-bar"><div class="progress-fill" id="loadingProgress"></div></div>
    <div class="progress-text" id="loadingText">首次加载需要下载模型，请耐心等待</div>
    <button class="cancel-btn" onclick="cancelModelLoad()">取消</button>
  </div>

  <script type="module">
    // Dynamic imports - loaded on demand so page renders immediately
    var webllm = null;
    var webllmLoading = false;
    var NiedieBrain = null;

    async function ensureWebLLM() {
      if (webllm) return webllm;
      if (webllmLoading) {
        while (webllmLoading) { await new Promise(r => setTimeout(r, 100)); }
        return webllm;
      }
      webllmLoading = true;
      // Try multiple CDNs - esm.run may be blocked in some regions
      var cdns = [
        "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.78/+esm",
        "https://esm.run/@mlc-ai/web-llm",
        "https://unpkg.com/@mlc-ai/web-llm@0.2.78/+esm"
      ];
      var lastErr = null;
      for (var i = 0; i < cdns.length; i++) {
        try {
          var mod = await import(cdns[i]);
          webllm = mod;
          break;
        } catch(e) {
          lastErr = e;
          console.warn('CDN failed (' + cdns[i] + '):', e.message);
        }
      }
      webllmLoading = false;
      if (!webllm) {
        throw new Error('WebLLM库加载失败（所有CDN均不可用）。可能需要科学上网，或使用支持WebGPU的Chrome 113+浏览器。');
      }
      return webllm;
    }

    async function ensureBrain() {
      if (NiedieBrain) return NiedieBrain;
      var mod = await import("./brain.js");
      NiedieBrain = mod.NiedieBrain;
      return NiedieBrain;
    }

    // ===== State =====
    var engine = null;
    var modelLoaded = false;
    var currentModel = localStorage.getItem('niedie-model') || 'rule-based';
    var isGenerating = false;
    var crawlMode = false;
    var cameraStream = null;
    var pendingImage = null;
    var webgpuSupported = false;
    var webgpuChecked = false;

    // ===== 手搓AI State =====
    var brain = null;
    var brainTraining = false;
    var BRAIN_KEY = 'niedie-brain-weights';

    // Check WebGPU support (async, resolved before model load)
    async function checkWebGPU() {
      if (!navigator.gpu) { webgpuChecked = true; return false; }
      try {
        var adapter = await navigator.gpu.requestAdapter();
        webgpuSupported = !!adapter;
      } catch(e) { webgpuSupported = false; }
      webgpuChecked = true;
      return webgpuSupported;
    }

    // ===== Credits System =====
    var CREDITS_CONFIG = {
      initial: 1000, dailyCheckin: 200, chatCost: 10,
      crawlCost: 50, visionCost: 100, maxCredits: 5000,
    };
    var CREDITS_KEY = 'niedie-ai-credits';
    var CHECKIN_KEY = 'niedie-ai-last-checkin';

    function loadCredits() {
      var v = parseInt(localStorage.getItem(CREDITS_KEY));
      return isNaN(v) ? CREDITS_CONFIG.initial : v;
    }
    function saveCredits(v) {
      v = Math.min(v, CREDITS_CONFIG.maxCredits);
      localStorage.setItem(CREDITS_KEY, v.toString());
    }
    function spendCredits(amount) {
      var cur = loadCredits();
      if (cur < amount) {
        showCreditsToast('积分不足！需要 ' + amount + '，当前 ' + cur, true);
        return false;
      }
      saveCredits(cur - amount);
      updateCreditsDisplay();
      return true;
    }
    function updateCreditsDisplay() {
      var v = loadCredits();
      var pct = Math.min(100, (v / CREDITS_CONFIG.maxCredits) * 100);
      var el1 = document.getElementById('sidebarCredits');
      var el2 = document.getElementById('headerCredits');
      var el3 = document.getElementById('modalCurrentCredits');
      var el4 = document.getElementById('creditsFill');
      if (el1) el1.textContent = v;
      if (el2) el2.textContent = v;
      if (el3) el3.textContent = v;
      if (el4) el4.style.width = pct + '%';
    }
    function dailyCheckin() {
      var today = new Date().toISOString().slice(0, 10);
      var last = localStorage.getItem(CHECKIN_KEY);
      if (last === today) {
        showCreditsToast('今天已签到，明天再来吧！', false);
        return;
      }
      var cur = loadCredits();
      saveCredits(cur + CREDITS_CONFIG.dailyCheckin);
      localStorage.setItem(CHECKIN_KEY, today);
      updateCreditsDisplay();
      checkCheckinStatus();
      showCreditsToast('签到成功！+' + CREDITS_CONFIG.dailyCheckin + ' 积分', false);
    }
    function checkCheckinStatus() {
      var today = new Date().toISOString().slice(0, 10);
      var last = localStorage.getItem(CHECKIN_KEY);
      var btn = document.getElementById('checkinBtn');
      var modal = document.getElementById('modalLastCheckin');
      if (last === today) {
        if (btn) { btn.disabled = true; btn.textContent = '✅ 已签到'; }
        if (modal) modal.textContent = today;
      } else {
        if (btn) { btn.disabled = false; btn.textContent = '📋 签到+200'; }
        if (modal) modal.textContent = last || '未签到';
      }
    }
    function showCreditsToast(msg, isError) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show' + (isError ? ' error' : ' success');
      setTimeout(function() { toast.className = 'toast'; }, 3000);
    }
    function openCreditsModal() { document.getElementById('creditsModal').classList.add('active'); checkCheckinStatus(); }
    function closeCreditsModal() { document.getElementById('creditsModal').classList.remove('active'); }

    // ===== Conversations =====
    var CONV_KEY = 'niedie-ai-conversations';
    var conversations = [];
    var currentConvId = null;

    function loadConversations() {
      try { conversations = JSON.parse(localStorage.getItem(CONV_KEY)) || []; } catch(e) { conversations = []; }
    }
    function saveConversations() {
      try {
        localStorage.setItem(CONV_KEY, JSON.stringify(conversations));
      } catch(e) {
        console.warn('保存对话失败:', e);
        showCreditsToast('⚠️ 存储空间不足，部分对话可能无法保存', true);
      }
    }
    function newConversation() {
      var conv = { id: Date.now(), title: '新对话', messages: [], model: currentModel };
      conversations.unshift(conv);
      if (conversations.length > 50) conversations = conversations.slice(0, 50);
      saveConversations();
      currentConvId = conv.id;
      renderConvList();
      renderMessages();
      closeSidebarMobile();
    }
    function switchConversation(id) {
      currentConvId = id;
      renderConvList();
      renderMessages();
      closeSidebarMobile();
    }
    function deleteConversation(id, e) {
      e.stopPropagation();
      conversations = conversations.filter(function(c) { return c.id !== id; });
      if (currentConvId === id) {
        currentConvId = conversations.length > 0 ? conversations[0].id : null;
      }
      saveConversations();
      renderConvList();
      renderMessages();
    }
    function getCurrentConv() {
      return conversations.find(function(c) { return c.id === currentConvId; });
    }
    function renderConvList() {
      var el = document.getElementById('convList');
      if (conversations.length === 0) {
        el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">暂无对话</div>';
        return;
      }
      el.innerHTML = conversations.map(function(c) {
        return '<div class="conv-item' + (c.id === currentConvId ? ' active' : '') + '" onclick="switchConversation(' + c.id + ')">' +
          '<span>💬</span>' +
          '<span class="conv-title">' + escapeHtml(c.title) + '</span>' +
          '<span class="conv-del" onclick="deleteConversation(' + c.id + ', event)">×</span>' +
          '</div>';
      }).join('');
    }
    function renderMessages() {
      var conv = getCurrentConv();
      var el = document.getElementById('messages');
      if (!conv || conv.messages.length === 0) {
        el.innerHTML = '<div class="msg-system">🦋 逆蝶AI v6.0 — 浏览器内运行真实大语言模型 + 手搓神经网络<br>数据不出本地，完全隐私安全</div>';
        return;
      }
      el.innerHTML = conv.messages.map(function(m) {
        var cls = m.role === 'user' ? 'msg-user' : (m.role === 'system' ? 'msg-system' : 'msg-ai');
        var costHtml = (!m.isUser && m.cost) ? '<span class="msg-cost">消耗 ' + m.cost + ' 积分</span>' : '';
        var imgHtml = m.image ? '<img class="msg-img" src="' + m.image + '">' : '';
        return '<div class="msg ' + cls + '">' + escapeHtml(m.content) + imgHtml + costHtml + '</div>';
      }).join('');
      el.scrollTop = el.scrollHeight;
    }
    function addMessage(role, content, cost, image) {
      var conv = getCurrentConv();
      if (!conv) { newConversation(); conv = getCurrentConv(); }
      var msg = { role: role, content: content, cost: cost, image: image, isUser: role === 'user' };
      conv.messages.push(msg);
      if (conv.messages.length === 1 && role === 'user') {
        conv.title = content.slice(0, 30);
      }
      saveConversations();
      renderMessages();
      renderConvList();
      return msg;
    }

    // ===== Model Management =====
    async function loadModel(modelId) {
      if (modelId === 'rule-based') {
        modelLoaded = true;
        engine = null;
        updateStatusBadge('online', '规则模式');
        return;
      }

      if (modelId === 'brain') {
        if (brain && brain.trained) {
          modelLoaded = true;
          engine = null;
          updateStatusBadge('online', '手搓AI就绪');
        } else {
          modelLoaded = false;
          engine = null;
          updateStatusBadge('offline', '需先训练');
        }
        return;
      }

      // Wait for WebGPU check to complete
      if (!webgpuChecked) await checkWebGPU();

      if (!webgpuSupported) {
        showCreditsToast('浏览器不支持 WebGPU，已切换到规则模式', true);
        document.getElementById('modelSelect').value = 'rule-based';
        currentModel = 'rule-based';
        localStorage.setItem('niedie-model', 'rule-based');
        modelLoaded = true;
        engine = null;
        updateStatusBadge('online', '规则模式');
        return;
      }

      var loadingEl = document.getElementById('modelLoading');
      var titleEl = document.getElementById('loadingTitle');
      var progEl = document.getElementById('loadingProgress');
      var textEl = document.getElementById('loadingText');

      loadingEl.style.display = 'flex';
      titleEl.textContent = '正在加载模型: ' + modelId;
      progEl.style.width = '0%';
      textEl.textContent = '首次加载需要下载模型，请耐心等待';
      updateStatusBadge('loading', '加载中');

      try {
        var wllm = await ensureWebLLM();
        // Use hf-mirror.com (China-accessible HuggingFace mirror) instead of huggingface.co
        var appConfig = JSON.parse(JSON.stringify(wllm.prebuiltAppConfig));
        if (appConfig && appConfig.model_list) {
          appConfig.model_list.forEach(function(m) {
            if (m.model) m.model = m.model.replace('huggingface.co', 'hf-mirror.com');
            if (m.model_lib) m.model_lib = m.model_lib.replace('huggingface.co', 'hf-mirror.com');
            if (m.vocabulary) m.vocabulary = m.vocabulary.replace('huggingface.co', 'hf-mirror.com');
          });
        }
        textEl.textContent = '正在通过国内镜像下载模型，请耐心等待...';
        engine = await wllm.CreateMLCEngine(modelId, {
          appConfig: appConfig,
          initProgressCallback: function(report) {
            var pct = Math.round((report.progress || 0) * 100);
            progEl.style.width = pct + '%';
            textEl.textContent = report.text || (pct + '%');
          }
        });
        modelLoaded = true;
        loadingEl.style.display = 'none';
        updateStatusBadge('online', '已就绪');
        addMessage('system', '✅ 模型 ' + modelId + ' 加载完成，可以开始对话了！');
      } catch(err) {
        loadingEl.style.display = 'none';
        console.error('Model load error:', err);
        var errMsg = err.message || '未知错误';
        var tip = '模型加载失败';
        if (errMsg.includes('CDN') || errMsg.includes('加载失败')) {
          tip = '⚠️ WebLLM库加载失败\n可能原因：网络无法访问CDN（需科学上网）\n建议：使用规则模式或手搓AI';
        } else if (errMsg.includes('WebGPU') || errMsg.includes('gpu')) {
          tip = '⚠️ 浏览器不支持WebGPU\n请使用Chrome 113+或Edge 113+\n建议：使用规则模式或手搓AI';
        } else if (errMsg.includes('fetch') || errMsg.includes('network')) {
          tip = '⚠️ 模型文件下载失败\n模型文件存储在HuggingFace，国内可能无法访问\n建议：使用规则模式或手搓AI';
        } else {
          tip = '模型加载失败: ' + errMsg + '\n已切换到规则模式';
        }
        showCreditsToast(tip, true);
        document.getElementById('modelSelect').value = 'rule-based';
        currentModel = 'rule-based';
        modelLoaded = true;
        engine = null;
        updateStatusBadge('online', '规则模式');
      }
    }

    async function switchModel() {
      if (isGenerating) {
        showCreditsToast('正在生成回复中，请稍后再切换模型', true);
        document.getElementById('modelSelect').value = currentModel;
        return;
      }
      var sel = document.getElementById('modelSelect');
      var newModel = sel.value;
      if (newModel === currentModel && modelLoaded) return;

      if (engine) {
        try { engine.unload(); } catch(e) {}
        engine = null;
        modelLoaded = false;
      }
      currentModel = newModel;
      localStorage.setItem('niedie-model', newModel);

      // Show/hide brain panel
      var brainPanel = document.getElementById('brainPanel');
      var modelInfo = document.getElementById('modelInfo');
      if (newModel === 'brain') {
        brainPanel.style.display = 'block';
        modelInfo.textContent = '内置预训练模型，开箱即用。也可重新训练';
        await initBrain().catch(function(e) {
          updateTrainUI('加载失败: ' + e.message);
        });
      } else {
        brainPanel.style.display = 'none';
        modelInfo.textContent = '首次加载需下载模型，之后缓存';
      }

      loadModel(newModel);
    }

    // ===== 手搓AI Functions =====
    async function initBrain() {
      if (!brain) {
        var BrainClass = await ensureBrain();
        brain = new BrainClass();
        // 尝试加载内置预训练权重
        updateTrainUI('⏳ 正在加载预训练模型...');
        var loaded = await brain.loadPretrained();
        if (loaded && brain.trained) {
          updateTrainUI('✅ 预训练模型已就绪，可直接对话！');
          document.getElementById('trainBtn').textContent = '🔁 重新训练（可选）';
          modelLoaded = true;
          updateStatusBadge('online', '手搓AI就绪');
          return;
        }
        // 尝试加载用户之前训练保存的权重
        var saved = localStorage.getItem(BRAIN_KEY);
        if (saved) {
          if (saved.startsWith('{')) {
            if (brain.deserialize(saved)) {
              updateTrainUI('✅ 已加载训练好的模型');
              document.getElementById('trainBtn').textContent = '🔁 重新训练';
              modelLoaded = true;
              updateStatusBadge('online', '手搓AI就绪');
              return;
            }
          } else {
            if (brain.deserializeBinary(saved)) {
              updateTrainUI('✅ 已加载训练好的模型');
              document.getElementById('trainBtn').textContent = '🔁 重新训练';
              modelLoaded = true;
              updateStatusBadge('online', '手搓AI就绪');
              return;
            }
          }
        }
        updateTrainUI('⚠️ 预训练模型加载失败，可点击训练按钮手动训练');
      }
      if (brain && brain.trained) {
        updateTrainUI('✅ 模型已就绪，可直接对话！');
        document.getElementById('trainBtn').textContent = '🔁 重新训练（可选）';
        modelLoaded = true;
        updateStatusBadge('online', '手搓AI就绪');
      } else {
        updateTrainUI('点击上方按钮开始训练');
      }
    }

    async function startBrainTraining() {
      if (brainTraining) return;
      brainTraining = true;
      var btn = document.getElementById('trainBtn');
      btn.disabled = true;
      btn.textContent = '⏳ 训练中...';

      var BrainClass = NiedieBrain || (await ensureBrain());
      if (!brain) brain = new BrainClass();

      var epochs = 30;
      await brain.train(null, epochs, function(progress, loss, epoch, totalEpochs) {
        var bar = document.getElementById('trainBar');
        var text = document.getElementById('trainProgress');
        bar.style.width = Math.round(progress * 100) + '%';
        text.textContent = 'Epoch ' + epoch + '/' + totalEpochs + ' | Loss: ' + loss.toFixed(3) + ' | ' + Math.round(progress * 100) + '%';
      });

      // Save weights (binary format)
      try {
        var serialized = brain.serializeBinary();
        localStorage.setItem(BRAIN_KEY, serialized);
      } catch(e) {
        console.warn('Failed to save brain weights:', e);
        try {
          showToast('存储空间不足，模型已加载但无法保存到本地');
        } catch(e2) {}
      }

      brainTraining = false;
      btn.disabled = false;
      btn.textContent = '🔁 重新训练';
      updateTrainUI('训练完成 ✓ 可以开始对话了！');
      showCreditsToast('神经网络训练完成！', false);
      modelLoaded = true;
      updateStatusBadge('online', '手搓AI就绪');
    }

    function updateTrainUI(msg) {
      var text = document.getElementById('trainProgress');
      if (text) text.textContent = msg;
    }

    async function brainChat(text) {
      if (!brain || !brain.trained) {
        return '模型尚未训练，请先点击训练按钮。';
      }
      // Build context prompt
      var prompt = '用户：' + text + '\n逆蝶：';
      var reply = brain.generate(prompt, 200, 0.7);
      if (!reply || reply.trim().length === 0) {
        reply = '让我想想... 我是一个小型神经网络，有时候会词穷。换个话题试试？';
      }
      return reply;
    }

    function cancelModelLoad() {
      if (engine) {
        try { engine.unload(); } catch(e) {}
        engine = null;
      }
      document.getElementById('modelLoading').style.display = 'none';
      document.getElementById('modelSelect').value = 'rule-based';
      currentModel = 'rule-based';
      modelLoaded = true;
      updateStatusBadge('online', '规则模式');
      showCreditsToast('已取消模型加载，切换到规则模式', false);
    }

    function updateStatusBadge(type, text) {
      var badge = document.getElementById('statusBadge');
      badge.className = 'header-badge badge-' + type;
      badge.textContent = text;
    }

    // ===== Chat =====
    var SYSTEM_PROMPT = '你是逆蝶AI，一个智能、友好、有幽默感的AI助手。你由逆蝶团队创建，运行在用户浏览器中。回答要简洁、准确、有温度。用户使用中文时用中文回复，使用英文时用英文回复。';

    async function sendMessage() {
      var input = document.getElementById('input');
      var text = input.value.trim();
      if (!text || isGenerating) return;

      if (!modelLoaded) {
        showCreditsToast('模型尚未加载完成，请稍候', true);
        return;
      }

      if (!spendCredits(CREDITS_CONFIG.chatCost)) return;

      input.value = '';
      autoResize(input);

      addMessage('user', text);
      crawlMode = false;
      document.getElementById('crawlBtn').classList.remove('active');

      // Show typing indicator
      var typingEl = document.createElement('div');
      typingEl.className = 'typing-indicator';
      typingEl.id = 'typingIndicator';
      typingEl.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      document.getElementById('messages').appendChild(typingEl);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;

      isGenerating = true;
      document.getElementById('sendBtn').disabled = true;

      try {
        var conv = getCurrentConv();
        if (!conv) { newConversation(); conv = getCurrentConv(); }
        // Build history excluding system messages and empty assistant messages
        var history = conv.messages.filter(function(m) {
          return m.role !== 'system' && m.content && m.content.length > 0;
        }).slice(-20).map(function(m) {
          return { role: m.role === 'user' ? 'user' : 'assistant', content: m.content };
        });

        if (engine && currentModel !== 'rule-based' && currentModel !== 'brain') {
          // WebLLM streaming
          var messages = [{ role: 'system', content: SYSTEM_PROMPT }].concat(history);
          typingEl.remove();

          // Create assistant message element directly (avoid re-render)
          var replyDiv = document.createElement('div');
          replyDiv.className = 'msg msg-ai';
          var textNode = document.createElement('span');
          replyDiv.appendChild(textNode);
          var costSpan = document.createElement('span');
          costSpan.className = 'msg-cost';
          costSpan.textContent = '消耗 ' + CREDITS_CONFIG.chatCost + ' 积分';
          replyDiv.appendChild(costSpan);
          document.getElementById('messages').appendChild(replyDiv);
          document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;

          var reply = '';
          var chunks = await engine.chat.completions.create({
            messages: messages,
            stream: true,
            temperature: 0.7,
            max_tokens: 1024,
          });

          for await (const chunk of chunks) {
            var delta = chunk.choices[0] && chunk.choices[0].delta && chunk.choices[0].delta.content;
            if (delta) {
              reply += delta;
              textNode.textContent = reply;
              document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            }
          }

          if (!reply) reply = '（模型返回了空回复，请重试）';
          textNode.textContent = reply;
          // Save to conversation
          conv.messages.push({ role: 'assistant', content: reply, cost: CREDITS_CONFIG.chatCost, isUser: false });
          saveConversations();
          renderConvList();
        } else if (currentModel === 'brain' && brain && brain.trained) {
          // Brain (hand-built neural network)
          typingEl.remove();

          var replyDiv3 = document.createElement('div');
          replyDiv3.className = 'msg msg-ai';
          var textNode3 = document.createElement('span');
          replyDiv3.appendChild(textNode3);
          var costSpan3 = document.createElement('span');
          costSpan3.className = 'msg-cost';
          costSpan3.textContent = '消耗 ' + CREDITS_CONFIG.chatCost + ' 积分';
          replyDiv3.appendChild(costSpan3);
          document.getElementById('messages').appendChild(replyDiv3);

          var brainReply = await brainChat(text);

          // Simulate streaming for brain output
          var displayed3 = '';
          for (var j = 0; j < brainReply.length; j++) {
            displayed3 += brainReply[j];
            textNode3.textContent = displayed3;
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            if (j % 3 === 0) await new Promise(function(r) { setTimeout(r, 15); });
          }
          textNode3.textContent = brainReply;
          conv.messages.push({ role: 'assistant', content: brainReply, cost: CREDITS_CONFIG.chatCost, isUser: false });
          saveConversations();
          renderConvList();
        } else {
          // Rule-based fallback
          typingEl.remove();
          var ruleReply = clientSmartReply(text);

          // Create assistant message element directly
          var replyDiv2 = document.createElement('div');
          replyDiv2.className = 'msg msg-ai';
          var textNode2 = document.createElement('span');
          replyDiv2.appendChild(textNode2);
          var costSpan2 = document.createElement('span');
          costSpan2.className = 'msg-cost';
          costSpan2.textContent = '消耗 ' + CREDITS_CONFIG.chatCost + ' 积分';
          replyDiv2.appendChild(costSpan2);
          document.getElementById('messages').appendChild(replyDiv2);

          // Simulate streaming
          var displayed = '';
          for (var i = 0; i < ruleReply.length; i++) {
            displayed += ruleReply[i];
            textNode2.textContent = displayed;
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            if (i % 3 === 0) await new Promise(function(r) { setTimeout(r, 15); });
          }
          textNode2.textContent = ruleReply;
          conv.messages.push({ role: 'assistant', content: ruleReply, cost: CREDITS_CONFIG.chatCost, isUser: false });
          saveConversations();
          renderConvList();
        }
      } catch(err) {
        var ti = document.getElementById('typingIndicator');
        if (ti) ti.remove();
        console.error('Chat error:', err);

        // Fallback to rule-based
        var fbReply = clientSmartReply(text);
        var conv2 = getCurrentConv();
        conv2.messages.push({ role: 'assistant', content: fbReply, cost: CREDITS_CONFIG.chatCost, isUser: false });
        saveConversations();
        renderMessages();
        renderConvList();
        showCreditsToast('AI模型出错，已使用规则模式回复', true);
      } finally {
        isGenerating = false;
        document.getElementById('sendBtn').disabled = false;
        var ti2 = document.getElementById('typingIndicator');
        if (ti2) ti2.remove();
      }
    }

    // ===== Rule-based Smart Reply (Fallback) =====
    function clientSmartReply(text) {
      var t = text.toLowerCase().trim();

      // Greetings
      if (/\b(hi|hello|hey|你好|嗨|哈喽)\b/.test(t)) {
        var greetings = ['你好呀！我是逆蝶AI 🦋 有什么可以帮你的吗？', '嗨！很高兴见到你～', '你好！今天过得怎么样？'];
        return greetings[Math.floor(Math.random() * greetings.length)];
      }
      if (/早上好|早安|早/.test(t)) return '早上好！新的一天，元气满满！☀️';
      if (/下午好/.test(t)) return '下午好！工作顺利吗？';
      if (/晚上好|晚安/.test(t)) return t.includes('晚安') ? '晚安！做个好梦 🌙' : '晚上好！今天辛苦了';

      // Self intro
      if (/你是谁|你叫什么|介绍一下你自己|你是什么/.test(t))
        return '我是逆蝶AI 🦋 一个运行在浏览器中的智能助手。我可以聊天、回答问题、写文案、做计算等。v6.0版本支持在浏览器内运行真实大语言模型，还内置了手搓神经网络（位置编码+残差连接+核采样）！';

      // Credits
      if (/积分|credit/.test(t)) {
        var v = loadCredits();
        return '你当前有 ' + v + ' 积分。每日签到可获得200积分，对话消耗10积分。积分上限5000。';
      }

      // Math
      var mathMatch = text.match(/(\d+(?:\.\d+)?)\s*([+\-*/×÷])\s*(\d+(?:\.\d+)?)/);
      if (mathMatch) {
        var a = parseFloat(mathMatch[1]), b = parseFloat(mathMatch[3]), op = mathMatch[2];
        var r;
        if (op === '+') r = a + b;
        else if (op === '-') r = a - b;
        else if (op === '*' || op === '×') r = a * b;
        else if (op === '/' || op === '÷') r = b !== 0 ? a / b : '除数不能为零';
        return a + ' ' + op + ' ' + b + ' = ' + r;
      }

      // Time & date
      if (/几点|时间|现在几点/.test(t)) return '现在是 ' + new Date().toLocaleTimeString('zh-CN');
      if (/今天|日期|几号|星期/.test(t)) {
        var d = new Date();
        var days = ['日','一','二','三','四','五','六'];
        return '今天是 ' + d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 星期' + days[d.getDay()];
      }

      // Jokes
      if (/笑话|joke|讲个笑话/.test(t)) {
        var jokes = [
          '程序员的老婆说："去超市买一瓶牛奶，如果有鸡蛋，买六个。" 程序员回来带了六瓶牛奶。老婆问为什么，他说："因为他们有鸡蛋。"',
          '为什么程序员喜欢黑色背景？因为白色背景会让他们想起Word文档。',
          '一个SQL查询走进酒吧，看到两张桌子，问："我能JOIN你们吗？"',
          '世界上有10种人：懂二进制的和不懂的。',
          '前端工程师最讨厌什么？IE浏览器。',
        ];
        return jokes[Math.floor(Math.random() * jokes.length)];
      }

      // Creative
      if (/写.*诗|作诗|写诗/.test(t)) return '数字的翅膀\n在代码的海洋里飞翔\n寻找那一行\n属于灵魂的出口\n\n——逆蝶AI';
      if (/讲.*故事|写.*故事/.test(t)) return '从前有一只蝴蝶，它不愿随波逐流，选择了逆风飞行。它飞过高山，越过大海，最终发现：真正的自由不是顺流而下，而是逆流而上。这就是"逆蝶"的由来。';
      if (/文案|slogan|广告语/.test(t)) return '🦋 逆蝶AI — 逆风飞翔，智能无限';

      // Knowledge
      if (/太阳系|solar system/.test(t)) return '太阳系有8颗行星：水星、金星、地球、火星、木星、土星、天王星、海王星。冥王星于2006年被降级为矮行星。';
      if (/光速|speed of light/.test(t)) return '光速约为 299,792,458 米/秒（约30万公里/秒），是宇宙中最快的速度。';
      if (/黑洞|black hole/.test(t)) return '黑洞是时空中引力极强的区域，连光都无法逃逸。它由大质量恒星坍缩形成，中心是奇点。';
      if (/DNA/.test(t)) return 'DNA（脱氧核糖核酸）是携带遗传信息的分子，由A、T、C、G四种碱基组成双螺旋结构。';
      if (/圆周率|π|pi/.test(t)) return '圆周率 π ≈ 3.14159265358979...，是圆的周长与直径之比，是一个无理数。';

      // Food
      if (/吃什么|美食|菜谱|做什么菜/.test(t)) return '推荐你试试番茄炒蛋：番茄切块，鸡蛋打散炒熟盛出，番茄炒出汁后加鸡蛋翻炒，加盐和糖调味即可。简单美味！';

      // Travel
      if (/旅游|旅行|去哪玩|推荐.*景点/.test(t)) return '推荐去西藏看看布达拉宫，感受雪域高原的壮美；或者去云南大理洱海边发发呆。如果喜欢城市，成都的美食和慢节奏生活也很棒！';

      // Health
      if (/减肥|瘦身|减脂/.test(t)) return '科学减肥：1) 控制热量摄入（少吃高糖高油）2) 每周3-5次有氧运动30分钟 3) 保证充足睡眠 4) 多喝水。贵在坚持！';
      if (/失眠|睡不着|睡眠/.test(t)) return '改善睡眠：1) 睡前1小时不看手机 2) 保持卧室黑暗安静 3) 温水泡脚 4) 深呼吸放松 5) 固定作息时间。';

      // Coding
      if (/html|css|javascript|前端/.test(t)) return '前端三件套：HTML负责结构（骨架），CSS负责样式（皮肤），JavaScript负责交互（灵魂）。学好这三个就能做出漂亮的网页！';
      if (/python/.test(t)) return 'Python是一门简洁优雅的编程语言，适合入门。特点：语法简单、库丰富、社区活跃。常用领域：数据分析、AI、Web后端、自动化脚本。';
      if (/node\.?js|node/.test(t)) return 'Node.js让JavaScript可以在服务器端运行，使用Chrome V8引擎。适合构建高性能网络应用，npm有海量第三方包可用。';

      // Emotions
      if (/难过|伤心|不开心|抑郁|emo/.test(t)) return '抱抱你 🤗 每个人都有低谷的时候，这很正常。试着出去走走，晒晒太阳，或者找我聊聊天。你并不孤单。';
      if (/开心|高兴|哈哈|lol/.test(t)) return '看到你开心我也开心！😄 继续保持好心情吧！';
      if (/孤独|lonely|一个人/.test(t)) return '一个人也可以很精彩。读一本好书，听一首好歌，或者和我聊聊天。逆蝶一直在这里陪着你 🦋';

      // Philosophy
      if (/人生.*意义|活着.*意义|生命的意义/.test(t)) return '人生的意义不在于寻找标准答案，而在于创造属于自己的答案。每个人都是独特的蝴蝶，逆风也能飞翔。';

      // Default
      var defaults = [
        '我理解你的意思。能说得更具体一些吗？',
        '有意思的问题！让我想想... 你可以从不同角度描述一下吗？',
        '好的，我收到了。你想深入聊聊这个话题吗？',
        '这个问题不错。如果你能提供更多细节，我能给你更好的回答。',
        '我在听。继续说说你的想法吧～',
      ];
      return defaults[Math.floor(Math.random() * defaults.length)];
    }

    // ===== Crawl =====
    async function executeCrawl(url) {
      if (!spendCredits(CREDITS_CONFIG.crawlCost)) return;
      addMessage('user', '🕷️ 爬取: ' + url);

      var typingEl = document.createElement('div');
      typingEl.className = 'typing-indicator';
      typingEl.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      document.getElementById('messages').appendChild(typingEl);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;

      try {
        var resp = await fetch('/api/crawl', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });
        typingEl.remove();

        if (resp.ok) {
          var data = await resp.json();
          var content = data.content || data.text || '未能获取内容';
          if (content.length > 2000) content = content.slice(0, 2000) + '\n\n...(内容过长，已截断)';
          addMessage('assistant', '📄 爬取结果：\n\n' + content, CREDITS_CONFIG.crawlCost);
        } else {
          // Client-side fallback
          addMessage('assistant', '⚠️ 服务端不可用，尝试直接获取...\n\n由于浏览器跨域限制，建议在本地运行 server.js 获得完整爬虫功能。', CREDITS_CONFIG.crawlCost);
        }
      } catch(err) {
        typingEl.remove();
        addMessage('assistant', '⚠️ 爬取失败：网络错误或服务端未运行。建议在本地启动 server.js 获得完整功能。', CREDITS_CONFIG.crawlCost);
      }
    }

    // ===== Vision =====
    async function executeVision(imageDataUrl) {
      if (!spendCredits(CREDITS_CONFIG.visionCost)) return;

      var typingEl = document.createElement('div');
      typingEl.className = 'typing-indicator';
      typingEl.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      document.getElementById('messages').appendChild(typingEl);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;

      try {
        var resp = await fetch('/api/vision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageDataUrl })
        });
        typingEl.remove();

        if (resp.ok) {
          var data = await resp.json();
          addMessage('assistant', '🔍 识别结果：\n\n' + (data.description || data.text || '未能识别'), CREDITS_CONFIG.visionCost, imageDataUrl);
        } else {
          addMessage('assistant', '⚠️ 图片识别服务不可用。建议在本地启动 server.js 并配置 OPENAI_API_KEY 获得图片识别功能。\n\n图片已保存，你可以描述图片内容让我帮忙分析。', CREDITS_CONFIG.visionCost, imageDataUrl);
        }
      } catch(err) {
        typingEl.remove();
        addMessage('assistant', '⚠️ 图片识别服务未运行。建议在本地启动 server.js 获得完整功能。', CREDITS_CONFIG.visionCost, imageDataUrl);
      }
    }

    // ===== Camera =====
    function openCamera() {
      var modal = document.getElementById('cameraModal');
      modal.classList.add('active');
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function(stream) {
          cameraStream = stream;
          document.getElementById('cameraVideo').srcObject = stream;
        })
        .catch(function(err) {
          showCreditsToast('无法访问摄像头: ' + err.message, true);
          closeCamera();
        });
    }
    function closeCamera() {
      document.getElementById('cameraModal').classList.remove('active');
      if (cameraStream) {
        cameraStream.getTracks().forEach(function(t) { t.stop(); });
        cameraStream = null;
      }
    }
    function capturePhoto() {
      var video = document.getElementById('cameraVideo');
      var canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      var ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      closeCamera();
      executeVision(dataUrl);
    }

    function handleFileUpload(event) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        executeVision(e.target.result);
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    // ===== UI Helpers =====
    function toggleCrawlMode() {
      crawlMode = !crawlMode;
      var btn = document.getElementById('crawlBtn');
      if (crawlMode) {
        btn.classList.add('active');
        document.getElementById('input').placeholder = '输入要爬取的网址...';
      } else {
        btn.classList.remove('active');
        document.getElementById('input').placeholder = '输入消息... (Enter发送, Shift+Enter换行)';
      }
    }
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }
    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    }
    function handleSend() {
      var input = document.getElementById('input');
      var text = input.value.trim();
      if (!text) return;

      if (crawlMode) {
        input.value = '';
        autoResize(input);
        executeCrawl(text);
      } else {
        sendMessage();
      }
    }
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
    function closeSidebarMobile() {
      document.getElementById('sidebar').classList.remove('open');
    }
    function escapeHtml(s) {
      if (!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Close modal on outside click
    document.getElementById('creditsModal').addEventListener('click', function(e) {
      if (e.target === this) closeCreditsModal();
    });
    document.getElementById('cameraModal').addEventListener('click', function(e) {
      if (e.target === this) closeCamera();
    });

    // Expose functions to window for onclick handlers
    window.newConversation = newConversation;
    window.switchConversation = switchConversation;
    window.deleteConversation = deleteConversation;
    window.switchModel = switchModel;
    window.cancelModelLoad = cancelModelLoad;
    window.handleSend = handleSend;
    window.sendMessage = sendMessage;
    window.toggleCrawlMode = toggleCrawlMode;
    window.openCamera = openCamera;
    window.closeCamera = closeCamera;
    window.capturePhoto = capturePhoto;
    window.handleFileUpload = handleFileUpload;
    window.dailyCheckin = dailyCheckin;
    window.openCreditsModal = openCreditsModal;
    window.closeCreditsModal = closeCreditsModal;
    window.toggleSidebar = toggleSidebar;
    window.autoResize = autoResize;
    window.handleKeyDown = handleKeyDown;
    window.startBrainTraining = startBrainTraining;

    // ===== Init =====
    loadConversations();
    if (conversations.length === 0) {
      newConversation();
    } else {
      currentConvId = conversations[0].id;
      renderConvList();
      renderMessages();
    }
    updateCreditsDisplay();
    checkCheckinStatus();
    updateStatusBadge('offline', '未加载');

    // Auto-load model
    document.getElementById('modelSelect').value = currentModel;
    (async function() {
      if (currentModel === 'rule-based') {
        modelLoaded = true;
        updateStatusBadge('online', '规则模式');
      } else if (currentModel === 'brain') {
        // Load brain but don't block
        initBrain().catch(function(){});
        var brainPanel = document.getElementById('brainPanel');
        if (brainPanel) brainPanel.style.display = 'block';
      } else {
        // WebLLM model - check WebGPU first
        await checkWebGPU();
        if (webgpuSupported) {
          loadModel(currentModel);
        } else {
          // Auto-fallback to rule-based
          document.getElementById('modelSelect').value = 'rule-based';
          currentModel = 'rule-based';
          localStorage.setItem('niedie-model', 'rule-based');
          modelLoaded = true;
          updateStatusBadge('online', '规则模式');
        }
      }
    })();
  </script>
